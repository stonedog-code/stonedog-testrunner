[project]
name = "slack-runtests"
version = "0.1.0"
description = "Prototype: run a pytest suite from a Slack slash command."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn>=0.52.4",
    "httpx>=0.28.0",
    "cryptography>=50.0.0",
    # Structured logging. Adopted rather than hand-rolled: `logsetup.py` here
    # was a worse version of `configure(only_if_unconfigured=True)`, written
    # because the package could not do it at the time. It can now.
    "stonedog-logs>=0.3.0",
]

[project.optional-dependencies]
# Postgres is NEVER a default. A standalone runner needs nothing but this repo
# and a file; the driver is installed only by a deployment that has said, with a
# DSN, that it wants the durable store. Installing it unconditionally would make
# the zero-config claim false for everybody in order to serve one deployment.
postgres = [
    "psycopg[binary]>=3.2.0",
    "psycopg-pool>=3.2.0",
]

[project.scripts]
slack-runtests = "slack_runtests.__main__:main"
# The two deployables. Each lives in its own top-level folder with its own
# README; they share this one project so there is one lockfile and one gate.
slack-runtests-edge = "edge_server.__main__:main"
slack-runtests-runner = "test_server.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/slack_runtests", "edge/edge_server", "test-server/test_server"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pyyaml>=6.0.3",
    # The store conformance suite runs against BOTH backends, so the driver is a
    # development dependency even though it is an optional runtime one. A suite
    # that could only reach one backend would be green over half the code it
    # claims to cover.
    "psycopg[binary]>=3.2.0",
    "psycopg-pool>=3.2.0",
]

[tool.pytest.ini_options]
# `tests/sample` is deliberately EXCLUDED from the default run: it is the suite
# the server executes on demand, not part of this project's own gate. Running it
# here would conflate "the prototype works" with "the demo suite passes".
# `tests/conformance` is one suite run against every configured store backend.
# It sits in the default run because SQLite — the default backend — needs no
# server and no network, so a laptop gets the same coverage as CI for the store
# it will actually use. Postgres joins the parameter list only when a DSN is
# set, and CI both sets one and asserts it was used; see tests/conformance/.
testpaths = ["tests/unit", "tests/conformance"]
# `edge/` and `test-server/` hold application code, not tests. Naming them here
# stops a bare `pytest` from walking into them looking for suites — and stops a
# directory called `test-server` from ever being mistaken for one.
#
# `fixture_suite` is the suite the integration tier feeds to the V1 runner. One
# of its tests FAILS ON PURPOSE, so it must never be collected by this project's
# own gate: `pytest tests/integration` would otherwise pick it up and go red for
# a reason that has nothing to do with the code under test. The runner still
# reaches it, because it names the product directory INSIDE it and collection
# therefore starts below the excluded name. Verified in both directions —
# removing this entry makes `pytest tests/integration` collect 8 tests instead
# of the tier's own.
norecursedirs = ["edge", "test-server", "docker", ".venv*", "tests/sample", "fixture_suite"]
markers = [
    "unit: fast, no I/O",
    "smoke: the sample suite the Slack command runs",
    "integration: talks to a real server over a real socket",
]
