# The proxy in front of the sidecar — and the one file in this example that is
# easy to get catastrophically wrong.
#
# SLACK'S SIGNATURE IS COMPUTED OVER THE RAW REQUEST BODY BYTES.
#
# Anything that parses the form and re-serialises it changes those bytes, and
# the edge then rejects EVERY real command as unsigned. The failure has two
# properties that make it expensive:
#
#   * it passes your tests. A test that signs whatever it is given signs the
#     re-serialised body too, so both sides agree and the suite is green.
#   * it looks like an outage, not a bug. Slack shows a generic failure and the
#     bot appears to be down.
#
# nginx's `proxy_pass` forwards the body untouched, which is why it is used
# here. In an application framework it is on YOU: forward the raw bytes
# verbatim — in Next.js that is `await request.text()`, never `request.formData()`
# — along with both Slack headers. `examples/verify.sh` signs a fixed body with a
# known secret, sends it through this proxy, and fails if the far side rejects it.

server {
    listen 80;
    server_name _;

    # Everything under /api/testrunner/ goes to the sidecar, with the prefix
    # stripped. The trailing slash on BOTH the location and the proxy_pass is
    # what does the stripping; drop either one and the edge receives
    # /api/testrunner/slack/commands and answers 404.
    location /api/testrunner/ {
        proxy_pass http://edge:8500/;

        # Do not touch the body. No buffering games, no request rewriting.
        proxy_request_buffering on;
        proxy_http_version 1.1;

        # The two headers the signature check needs. They are ordinary headers
        # and nginx passes them through by default; they are named here so that
        # anyone copying this into a framework knows they must arrive.
        proxy_set_header X-Slack-Signature      $http_x_slack_signature;
        proxy_set_header X-Slack-Request-Timestamp $http_x_slack_request_timestamp;

        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # A claim long-poll is held open for EDGE_POLL_TIMEOUT (25s by default).
        # A proxy read timeout under that turns a normal idle poll into a 504,
        # which a test server reads as the edge being down.
        proxy_read_timeout 60s;
    }

    location / {
        return 200 "your app would be here\n";
        add_header Content-Type text/plain;
    }
}
