# STRATEGY B — EMBEDDED. The edge as a sidecar inside an app you already run.
#
#     cp .env.example .env      # then edit it
#     docker compose up -d
#     curl -i http://localhost:8080/api/testrunner/healthz
#
# WHAT MAKES THIS DIFFERENT FROM STRATEGY A
#
#   * THE EDGE PUBLISHES NO PORT. Look at the `edge` service below: there is no
#     `ports:` line. The only way in is through the app in front of it, which is
#     already handling TLS, and already has a hostname Slack will accept.
#   * THE STORE IS POSTGRES, not a file. This is the case where that matters: a
#     container service with no persistent volume deletes a SQLite file on every
#     redeploy, taking the queue, the in-flight leases and the whole run history
#     with it. A queue that forgets what it was doing whenever the site ships is
#     not a queue.
#
# `app` here is nginx standing in for whatever you actually run — a Next.js app,
# Django, Rails. What it demonstrates is the one thing that is easy to get
# wrong, and it is not the routing.

name: testrunner-embedded

services:
  # ── the app in front. Yours, not ours ─────────────────────────────────────
  app:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      edge:
        condition: service_healthy

  # ── the sidecar. No ports, by design ──────────────────────────────────────
  edge:
    # The published image. `examples/verify.sh` overrides this with a locally
    # built one so the example can be run against a checkout without editing
    # the file a reader is meant to copy.
    image: "${TESTRUNNER_EDGE_IMAGE:-ghcr.io/OWNER/REPO/edge:latest}"
    # build:
    #   context: ../..
    #   dockerfile: docker/Dockerfile
    #   target: edge
    restart: unless-stopped
    environment:
      # 0.0.0.0 so the app container can reach it over the compose network.
      # That is not a public bind: with no `ports:` line nothing outside this
      # network can open a connection to it at all.
      HOST: "0.0.0.0"
      PORT: "8500"

      SLACK_SIGNING_SECRET: "${SLACK_SIGNING_SECRET:?set this in .env}"
      SLACK_TEAM_ID: "${SLACK_TEAM_ID:?set this in .env}"
      RUNTESTS_CHANNELS: "${RUNTESTS_CHANNELS:-}"
      RUNTESTS_USERS: "${RUNTESTS_USERS:-}"
      # Required -- the edge refuses to start without them. `:?` rather than
      # `:-` on purpose: an unset allowlist must stop the stack here with a
      # readable message, not start a container that refuses and restart-loops.
      RUNTESTS_PRODUCTS: "${RUNTESTS_PRODUCTS:?set this in .env}"
      RUNTESTS_SERVERS: "${RUNTESTS_SERVERS:?set this in .env}"
      RUNTESTS_TEST_SCOPES: "${RUNTESTS_TEST_SCOPES:?set this in .env}"

      # THE DSN IS THE WHOLE POINT OF THIS DEPLOYMENT. Setting it is the only
      # way to select Postgres; leave it empty and the edge writes a SQLite file
      # onto a disk that may not survive the next deploy.
      #
      # THE PASSWORD APPEARS HERE INSIDE A URI, AND THE DATABASE BELOW WANTS IT
      # RAW. Those are two different encodings of one secret, and conflating
      # them is a trap with no error message: percent-encode the shared variable
      # and Postgres's password literally becomes `p%40ss`, so the DSN decodes to
      # something that no longer matches. Leave it raw and a `@` truncates the
      # host instead — reported as a networking error against a hostname you
      # never typed.
      #
      # So the DSN takes its own variable, defaulting to the raw one. With an
      # unreserved password (what `openssl rand -hex 32` gives you) they are the
      # same string and there is nothing to think about. With a password that
      # contains `@ / ? # : %`, set BOTH — see .env.example.
      EDGE_DB_DSN: "postgresql://${POSTGRES_USER:-testrunner}:${EDGE_DB_PASSWORD_ENCODED:-${POSTGRES_PASSWORD:?set this in .env}}@db:5432/${POSTGRES_DB:-testrunner}"
      EDGE_KEY_PATH: /app/keys/edge_ed25519.pem
      EDGE_TRUSTED_KEYS_DIR: /app/trusted_runners
      LOG_LEVEL: INFO
    volumes:
      # The edge's own identity still needs to survive a restart even though the
      # queue lives in Postgres: test servers pin its fingerprint, and a new key
      # means every one of them refuses to talk to it.
      - edge-keys:/app/keys
      - ./trusted_runners:/app/trusted_runners:ro
    depends_on:
      db:
        # NOT just `depends_on: [db]`. Compose's plain form waits for the
        # container to be CREATED, not for Postgres to accept connections — so
        # the edge starts first, fails to reach the database, and exits. It then
        # restarts and works, which is worse than failing: it looks flaky.
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8500/healthz')"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s

  # ── your existing database. Shown here so the example runs on its own ─────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-testrunner}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?set this in .env}"
      POSTGRES_DB: "${POSTGRES_DB:-testrunner}"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-testrunner}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  edge-keys:
  db-data:
