# The merge gate for slack-runtests.
#
# It runs the same command the README documents — `bash run.sh test` — rather
# than a hand-written `uv run pytest`. If the documented entry point breaks,
# the gate goes red, which is the point: a CI recipe that drifts from the
# documented one tests something nobody actually runs.
name: CI

on:
  # Unscoped on purpose. `branches: [main]` would silently exempt a PR stacked
  # on another branch — the one most likely to need checking.
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  # Never cancel a run on `main`: its result is the record of what the trunk
  # actually does.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  # The job id is the status-check context that branch protection requires, so
  # keep it stable: renaming this job silently un-gates the branch, because
  # protection goes on requiring a context that no longer reports.
  gate:
    runs-on: ubuntu-latest

    # The store has two backends and the conformance suite runs against both.
    # SQLite needs nothing; Postgres needs this. Without it the suite would
    # still be green — over half the code it claims to cover — which is why the
    # step below asserts the backend was actually exercised rather than trusting
    # that the service came up.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: runner
          POSTGRES_PASSWORD: runner
          POSTGRES_DB: testrunner
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U runner"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      # uv installs the interpreter too, reading .python-version, so the runner
      # needs no system Python of any particular version.
      # Pinned to an exact release, not `@v10`: astral-sh/setup-uv stopped
      # publishing moving major tags after v7, so `@v10` resolves to nothing
      # and the job dies in "Set up job" before a single step runs.
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      # pytest exits 5 when it collects nothing, and run.sh execs it, so a
      # suite that silently stopped matching any files fails here rather than
      # passing over an empty set.
      - name: Unit tier
        run: bash run.sh test

      # The integration tier crosses two process boundaries the unit tier
      # cannot: a real uvicorn edge on an ephemeral port, spoken to over HTTP,
      # and a real pytest spawned by the V1 runner whose scraped counts are
      # compared to a fixture suite with a known outcome. It runs here rather
      # than only on a laptop because a tier that gates nothing is
      # documentation, not a gate — and these are the failures that leave every
      # in-process test green.
      #
      # pytest reports the size of its input set on the last line ("N passed"),
      # and exits 5 having collected nothing, so an empty run fails here.
      # One suite, both backends. TESTRUNNER_REQUIRED_BACKENDS is the guard
      # against the failure this repo keeps writing about: if the Postgres
      # service failed to start, `test_required_backends.py` FAILS rather than
      # the suite quietly running SQLite twice and reporting green. The header
      # of every run prints how many backends were exercised.
      - name: Store conformance tier (SQLite and Postgres)
        env:
          TESTRUNNER_TEST_POSTGRES_DSN: postgresql://runner:runner@localhost:5432/testrunner
          TESTRUNNER_REQUIRED_BACKENDS: sqlite,postgres
        run: bash run.sh test:conformance

      - name: Integration tier (real edge server, real pytest subprocess)
        run: bash run.sh test:integration

      # A Dockerfile that BUILDS proves almost nothing. The two targets differ
      # by a few COPY lines and two `uv sync` flags, and every way of getting
      # those wrong produces an image that builds perfectly and is wrong at
      # runtime — an edge that can run a suite, an edge with no Postgres
      # driver, a runner with no pytest. This checks what each image IS, and
      # prints the inventory it checked.
      - name: Image tier (what the edge and runner images actually contain)
        run: bash docker/smoke.sh

      # The two deployment examples, brought up for real. A configuration
      # example nobody runs is one that rots invisibly: the compose file still
      # parses, the README still reads correctly, and the first person to find
      # it broken is a stranger who trusted it.
      #
      # It also carries the check that cannot be made anywhere else — a signed
      # Slack command sent THROUGH the example proxy, which fails if anything
      # in the path re-serialises the body.
      - name: Example tier (both deployments, up for real)
        run: bash examples/verify.sh
